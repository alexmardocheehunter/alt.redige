<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LexCanvas</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6f6f4;
      color: #1c1c1a;
      font-family: Georgia, 'Times New Roman', serif;
    }
    main { text-align: center; padding: 2rem; max-width: 34rem; }
    h1 { font-size: 1.6rem; letter-spacing: 0.02em; margin-bottom: 0.6rem; }
    p { line-height: 1.6; color: #4a4a46; }
    .note {
      margin-top: 2rem;
      padding: 1rem 1.2rem;
      border: 1px solid #d8d8d2;
      border-radius: 0.5rem;
      background: #fff;
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      color: #6b6b66;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #17171a; color: #ececec; }
      p { color: #a8a8a3; }
      .note { background: #202024; border-color: #2e2e33; color: #8f8f8a; }
    }
  </style>
</head>
<body>
  <main>
    <h1>LexCanvas</h1>
    <p>Interface en cours d'intégration.</p>
    <div class="note">
      Le backend est disponible. L'interface définitive sera branchée sur cette page
      à la livraison du frontend.
    </div>
  </main>
</body>
</html>
